name: docker build

on:
  push:
    tags:
      - v*

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Image name
        run: echo "IMAGE_NAME=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v4

      - name: Login
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ env.IMAGE_NAME }}:${{ github.ref_name }}
            ghcr.io/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
            ghcr.io/${{ env.IMAGE_NAME }}:latest

      - name: Smoke test
        run: |
          image="ghcr.io/${{ env.IMAGE_NAME }}:${{ github.ref_name }}"
          docker pull "$image"
          docker rm -f hmo-smoke >/dev/null 2>&1 || true
          trap '{
            if docker inspect hmo-smoke >/dev/null 2>&1; then
              docker logs --tail 50 hmo-smoke 2>&1 || true
            fi
            docker rm -f hmo-smoke >/dev/null 2>&1 || true
          }' EXIT
          docker run -d --name hmo-smoke -p 127.0.0.1:3111:3000 "$image"
          for i in $(seq 1 30); do
            curl -fsS --max-time 5 http://127.0.0.1:3111/api | grep -q '"ok":true' && exit 0
            sleep 1
          done
          echo "smoke test failed: /api not ready"
          exit 1

      - name: Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
            echo "release ${{ github.ref_name }} exists"
          else
            gh release create "${{ github.ref_name }}" --title "${{ github.ref_name }}" --generate-notes --verify-tag
          fi
